# Mechanical review. Each check is a mistake reviewers kept correcting by hand;
# the rules and what enforces each one are listed in tools/guardrails/README.md.
#
# The same command runs locally before a push:
#   node tools/guardrails/check.mjs
#
# Unlike tests.yml this needs no stack, so it answers in about a minute.
#
# History:
# 20261027 CL/LH Created.
# 20261028 CL/LH Sync PRs (sync/* branches) run only the checks a merge can break.
# 20261103 CL/LH The description job judges the door against the change and reads the description's edit history.
# 20261107 CL/LH The description job sets up PHP 8.2 too: the door cross-check reads PHP files with PHP's own tokenizer.
# 20261109 CL/LH The description job judges with the base revision's checker, door map and reviewers; no checkout keeps credentials.

name: Guardrails

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: guardrails-${{ github.event_name }}-${{ github.ref }}-${{ github.event.action == 'edited' }}
  cancel-in-progress: true

jobs:
  change:
    name: Change checks
    # Editing the description changes no code; only the description job reruns.
    if: github.event.action != 'edited'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # The PR's own head, not GitHub's merge commit: line numbers match what
          # the author sees, and the order checks judge where the author put
          # things, not where a merge with newer master landed them.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2" # production runs 8.2
          coverage: none
          tools: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Guardrail regression tests
        run: node --test tools/guardrails/tests/*.test.mjs

      - name: Guardrails
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'sync/')
        run: node tools/guardrails/check.mjs --base "origin/$BASE_REF"
        env:
          BASE_REF: ${{ github.base_ref }}

      - name: Guardrails on a sync PR
        # A sync PR (master merged into a shared branch such as hml/shopify)
        # carries master's own, already merged code, so the style checks would
        # only flag master. What the merge itself can break is the same as after
        # a merge to master.
        if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'sync/')
        run: node tools/guardrails/check.mjs --base "origin/$BASE_REF" --only php-syntax,js-syntax,tekster
        env:
          BASE_REF: ${{ github.base_ref }}

      - name: Guardrails after merge
        # Only what two separately green PRs can break together: a merged file
        # that no longer parses, or two branches that took the same text id.
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: node tools/guardrails/check.mjs --base "$BEFORE" --only php-syntax,js-syntax,tekster
        env:
          BEFORE: ${{ github.event.before }}

  description:
    name: PR description
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history at the PR's head, so a "Door: two-way" is held
          # against the files the change touches, and the base revision's
          # checker can be read from it.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2" # the door cross-check reads PHP with PHP's own tokenizer
          coverage: none
          tools: none

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: The description's edit history
        # A body edit dismisses no approval, so a door exception counts only
        # when the history shows a reviewer added it. If this read fails, no
        # exception counts and everything else is still judged.
        continue-on-error: true
        run: |
          gh api graphql -F owner="${REPO%%/*}" -F name="${REPO#*/}" -F number="$NUMBER" -f query='
            query($owner: String!, $name: String!, $number: Int!) {
              repository(owner: $owner, name: $name) {
                pullRequest(number: $number) {
                  author { login }
                  userContentEdits(first: 100) { totalCount nodes { editor { login } deletedAt diff } }
                }
              }
            }' > "$RUNNER_TEMP/pr-edits.json"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}

      - name: Says what changed, how it was verified, and its door
        # A sync PR carries code its own PRs were judged on, so only its text
        # is judged, as in the change job.
        #
        # A PR is never judged by its own rules: the checker, the door map and
        # the reviewer list (tools/guardrails) come from the base revision, are
        # unpacked into $RUNNER_TEMP and judge this checkout, the PR's head
        # (check.mjs judges the repository it runs in, not the one it lives in).
        # Bootstrap: a base without the door map (tools/guardrails/lib/doors.mjs)
        # has no checker that reads a door, so the head's checker runs, and the
        # log says so.
        run: |
          if [[ "$HEAD_REF" == sync/* ]]; then change=(--text-only); else change=(--base "$BASE_SHA" --head "$HEAD_SHA"); fi
          if git cat-file -e "$BASE_SHA:tools/guardrails/lib/doors.mjs" 2>/dev/null; then
            policy="$RUNNER_TEMP/guardrails-policy"
            mkdir -p "$policy"
            git archive --format=tar "$BASE_SHA" tools/guardrails > "$policy.tar"
            tar -xf "$policy.tar" -C "$policy"
            checker="$policy/tools/guardrails/check.mjs"
            echo "door policy: tools/guardrails of the base revision $BASE_SHA judges this description"
          else
            checker=tools/guardrails/check.mjs
            echo "door policy: bootstrap, the base revision $BASE_SHA has no door map (tools/guardrails/lib/doors.mjs), so the PR head's tools/guardrails judges this description"
          fi
          printf '%s' "$PR_BODY" | node "$checker" --pr-body - --pr-edits "$RUNNER_TEMP/pr-edits.json" "${change[@]}"
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
