name: Tests

# Runs the whole suite on every pull request and every push to master.
#
# The job installs Saldi from scratch. That is not incidental: a clone of this
# repository cannot serve a page (includes/connect.php is generated by the
# install wizard and is gitignored), and every DB-backed test skips itself
# when there is no tenant to work against. Without the bootstrap step the job
# would report "OK" having exercised almost nothing - see
# tools/ci/bootstrap-stack.sh.

on:
  pull_request:
  push:
    branches: [master]

# A second push to the same PR cancels the first - these runs take minutes.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: PHPUnit + Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Every docker compose call in this job (bootstrap-stack.sh and
      # e2e/seed-user.mjs too) adds the CI file, which keeps the stack away from
      # the production locator.
      COMPOSE_FILE: docker-compose.yml:tools/ci/compose.ci.yml
      # Local-only credentials for the throwaway stack this job installs.
      # SALDI_E2E_TENANT_DB is exported by tools/ci/bootstrap-stack.sh.
      SALDI_PGPASS: password
      SALDI_E2E_ACCOUNT: saldi_chatbot_test
      SALDI_E2E_PASSWORD: e2etest-ci-local-2026

    steps:
      - uses: actions/checkout@v4

      - name: Start the stack
        run: |
          docker compose up -d --build
          docker compose ps

      - name: Install PHP dev dependencies
        # The entrypoint installs the app's runtime deps (includes/composer.json)
        # and, on a fresh checkout, symlinks vendor/ -> includes/vendor. The dev
        # tools live in the ROOT composer.json, so replace that symlink with a
        # real directory before installing them. Application code reaches the
        # runtime deps through /var/www/html/vendor, which the entrypoint links
        # separately, so this does not affect the app.
        run: |
          docker compose exec -T -w /var/www/html/saldi web bash -c '
            [ -L vendor ] && rm -f vendor
            composer install --no-interaction --no-progress
          '

      - name: Install Saldi (master database + accounting entity)
        run: bash tools/ci/bootstrap-stack.sh

      - name: Create a scratch database for the fixture suites
        # The kreditor lock and batch-posting suites, the open-post settle-date
        # report and the active-fiscal-years test build their own schemas or
        # temporary tables. They get a database of their own, apart from the
        # tenant.
        run: docker compose exec -T -e PGPASSWORD="$SALDI_PGPASS" postgres createdb -U user saldi_char_fixture

      - name: PHPUnit
        # tests/characterization posts real journals, invoices and stock moves
        # through the pages, against a clone of the tenant bootstrap-stack.sh
        # installed. Each suite skips itself when its setting is missing, so a
        # run without these variables is green without having touched them.
        env:
          FIXTURE_PG: host=postgres dbname=saldi_char_fixture user=user password=${{ env.SALDI_PGPASS }}
        run: >-
          docker compose exec -T
          -e SALDI_CHAR_PGUSER=user
          -e SALDI_CHAR_PGPASS="$SALDI_PGPASS"
          -e SALDI_CHAR_TEMPLATE_DB="$SALDI_E2E_TENANT_DB"
          -e SALDI_CHAR_PG_DSN="$FIXTURE_PG"
          -e SALDI_CHAR_DSN="pgsql:host=postgres;dbname=saldi_char_fixture"
          -e ACTIVE_FISCAL_YEARS_PG="$FIXTURE_PG"
          -w /var/www/html/saldi web
          php vendor/bin/phpunit --testdox --log-junit /tmp/phpunit-junit.xml

      - name: No unexpected skipped tests
        run: >-
          docker compose exec -T -w /var/www/html/saldi web
          php tools/ci/check-skips.php /tmp/phpunit-junit.xml

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Seed the e2e login
        run: node e2e/seed-user.mjs

      - name: Playwright
        run: npx playwright test

      - name: Collect diagnostics on failure
        if: failure()
        run: |
          echo '--- web container log (last 200 lines) ---'
          docker compose logs --tail 200 web || true
          echo '--- postgres container log (last 50 lines) ---'
          docker compose logs --tail 50 postgres || true

      - name: Upload Playwright artefacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
