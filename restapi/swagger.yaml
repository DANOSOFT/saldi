              type: string
            accountnr:
              type: string
            invoiceNumber:
              type: string
            invoiceDescription:
              type: string
            currency:
              type: string
              pattern: ^[A-Z]{3}$
            subject:
              type: string
        attached_at:
          type: string
          nullable: true
        bilag_nr:
          type: integer
          nullable: true
        deleted_at:
          type: string
          nullable: true
        review_state:
          type: string
        display_status:
          type: string
        rejection:
          type: object
          required:
          - code
          - message
          - at
          - by_name
          properties:
            code:
              type: string
            message:
              type: string
            at:
              type: string
            by_name:
              type: string
          nullable: true
        vat_code:
          type: string
          nullable: true
        bank_line_id:
          type: integer
          nullable: true
        etag:
          type: string
          pattern: ^"[0-9a-f]{64}"$
    T3Audit:
      type: object
      required:
      - items
      - total
      - limit
      - offset
      - chain_ok
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/T3AuditItem'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        chain_ok:
          type: boolean
    T3JournalDrafts:
      type: object
      required:
      - journal
      - items
      - totals
      - total
      - limit
      - offset
      properties:
        journal:
          type: object
