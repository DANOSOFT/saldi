                type: string
        '404':
          description: Unknown link
        '410':
          description: Link expired/cancelled/superseded
        '429':
          description: Public rate limited
    post:
      tags:
      - Saldi Mobile T2
      summary: Start/reuse a local provider payment attempt
      security: []
      parameters:
      - name: l
        in: query
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - csrf
              properties:
                csrf:
                  type: string
      description: Requires session cookie and matching CSRF from GET. Under link/group locks reuses young created
        attempts; authorized/capturing attempts block siblings. Old attempts resolve/cancel before replacement.
      responses:
        '303':
          description: Redirect to provider
          headers:
            Location:
              schema:
                type: string
                format: uri
        '200':
          description: Processing or terminal link state, Danish HTML
        '403':
          description: Invalid CSRF
        '429':
          description: Public rate limited
        '503':
          description: Provider unavailable
  /debitor/payments/link/webhook.php:
    servers:
    - url: ..
      description: SALDI installation root, relative to this Swagger document
    post:
      tags:
      - Saldi Mobile T2
      summary: Verified Vipps invoice-payment webhook
      security:
      - T2VippsHmac: []
      - T2VippsHmacFallback: []
      parameters:
      - name: t
        in: query
        required: true
        schema:
          type: integer
          minimum: 1
      - name: x-ms-date
        in: header
        required: true
        schema:
          type: string
        description: UTC RFC HTTP date within five minutes
      - name: x-ms-content-sha256
        in: header
        required: true
        schema:
          type: string
        description: Base64 SHA-256 of exact raw body
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
        description: Vipps HMAC-SHA256 signed headers; required unless X-Vipps-Authorization is supplied
      - name: X-Vipps-Authorization
        in: header
        required: false
        schema:
          type: string
        description: Accepted HMAC fallback when Authorization is absent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reference
              - name
              - pspReference
              - amount
              properties:
                reference:
                  type: string
                name:
                  type: string
                pspReference:
                  type: string
                amount:
                  type: object
                  required:
                  - value
                  - currency
                  properties:
                    value:
                      type: integer
                    currency:
                      type: string
                      pattern: ^[A-Z]{3}$
                timestamp:
                  type: string
                  format: date-time
                idempotencyKey:
                  type: string
      description: 'Verifies content hash/date/HMAC before storing event. Duplicate event: 200, no repeated booking.
        Provider authoritative state governs capture and amount. Each captured reference books once; surplus/mismatch
        becomes review, booking refusal becomes paid_unsettled. invoice_paid, payment_review and payment_unsettled
        inbox refs are openpost ids. Cron retries/polls through the same service.'
      responses:
        '200':
          description: Accepted, duplicate or ignored foreign reference
        '400':
          description: Malformed payload/tenant
        '401':
          description: Invalid HMAC, content hash or stale date; no event stored
        '500':
          description: Failed to durably accept event
