                pattern: ^-?[0-9]+(?:\.[0-9]{1,3})?$
              delta:
                type: string
                pattern: ^-?[0-9]+(?:\.[0-9]{1,3})?$
              outcome:
                type: string
                enum:
                - adjusted
                - unchanged
            additionalProperties: false
            required:
            - line_ref
            - vare_id
            - varenr
            - before
            - counted
            - after
            - delta
            - outcome
        adjusted_count:
          type: integer
        unchanged_count:
          type: integer
        value_estimate:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{2}$
        shop_sync:
          type: string
          enum:
          - done
          - partial
          - not_configured
        lager_name:
          type: string
        submitted_at:
          type: string
          format: date-time
        by_name:
          type: string
        line_count:
          type: integer
        note:
          type: string
          nullable: true
        started_at:
          type: string
          format: date-time
          nullable: true
      additionalProperties: false
      required:
      - count_id
      - lager
      - reason
      - lines
      - adjusted_count
      - unchanged_count
      - value_estimate
      - shop_sync
    T4Error:
      type: object
      properties:
        success:
          type: boolean
          enum:
          - false
        message:
          type: string
        data:
          type: object
          properties:
            error:
              type: string
              enum:
              - invalid_token
              - session_revoked
              - permission_denied
              - conflict
              - not_found
              - gone
              - precondition_failed
              - validation_failed
              - not_configured
              - internal
            details:
              oneOf:
              - type: object
                properties:
                  reason:
                    type: string
                  what:
                    type: string
                  lines:
                    type: array
                    items: {}
                additionalProperties: true
              - type: array
                maxItems: 0
                items: {}
          additionalProperties: true
          required:
          - error
          nullable: true
          description: Missing authentication and legacy tenant errors retain data=null; domain errors provide error
            and optional details.
      additionalProperties: false
      required:
      - success
      - message
      - data
    T4Claim:
      type: object
      properties:
        kind:
          type: string
          enum:
          - udlaeg
          - koersel
        employee:
          type: object
          properties:
            ansat_id:
              type: integer
            name:
              type: string
            initials:
              type: string
          additionalProperties: false
          required:
          - ansat_id
          - name
          - initials
          nullable: true
        defaults:
          type: object
          properties:
            contra:
              type: object
              properties:
                type:
                  type: string
                  enum:
                  - F
                kontonr:
                  type: integer
              additionalProperties: false
              required:
              - type
              - kontonr
            vat_exempt:
              type: boolean
          additionalProperties: false
          required:
          - contra
          - vat_exempt
      additionalProperties: false
      required:
      - kind
      - employee
      - defaults
      nullable: true
    T4TimeUpdateRequest:
      type: object
      properties:
        client_id:
          type: string
          format: uuid
        case_id:
          type: integer
        task_id:
          type: integer
        date:
          type: string
          format: date
        hours:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{2}$
        text:
          type: string
        overtime_50:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{2}$
        overtime_100:
          type: string
          pattern: ^-?[0-9]+\.[0-9]{2}$
        hour_type:
          type: string
          nullable: true
        timer:
          type: object
          properties:
            started_at:
              type: string
              format: date-time
            stopped_at:
              type: string
              format: date-time
          additionalProperties: false
          required:
          - started_at
          - stopped_at
      additionalProperties: false
      required:
      - client_id
    T4DeleteRequest:
      type: object
      properties:
        client_id:
          type: string
          format: uuid
      additionalProperties: false
      required:
      - client_id
    T4MileageTripUpdateRequest:
      type: object
      properties:
        client_id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        from:
          type: string
        to:
          type: string
        km:
          type: string
          pattern: ^[0-9]+\.[0-9]$
        purpose:
          type: string
      additionalProperties: false
      required:
      - client_id
    T4UploadClaim:
      type: object
      properties:
        kind:
          type: string
          enum:
          - udlaeg
      additionalProperties: false
      required:
      - kind

