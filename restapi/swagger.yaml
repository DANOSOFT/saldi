components:
  securitySchemes:
    T2VippsHmac:
      type: apiKey
      in: header
      name: Authorization
      description: HMAC-SHA256 SignedHeaders=x-ms-date;host;x-ms-content-sha256&Signature=<signature>
    T2VippsHmacFallback:
      type: apiKey
      in: header
      name: X-Vipps-Authorization
      description: Same Vipps HMAC credential, accepted when Authorization is absent
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT access token returned by POST /auth/login.php

  schemas:
    # T3-X1: response and request contracts (20261001 CDX/LH).
    T3ReviewList:
      type: object
      required:
      - items
      - total
      - limit
      - offset
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/T3ReviewItem'
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
    T3ReviewDetail:
      allOf:
      - $ref: '#/components/schemas/T3ReviewItem'
      - type: object
        required:
        - metadata
        - kreditor
        - rejection
        - draft
        - audit
        properties:
          metadata:
            type: object
            required:
            - vendor
            - description
            - amount
            - date
            - invoice_number
            - currency
            - kontonr
            - vat_code
            properties:
              vendor:
                type: string
              description:
                type: string
              amount:
                type: string
                pattern: ^-?[0-9]+\.[0-9]{2}$
                nullable: true
              date:
                type: string
                format: date
                nullable: true
              invoice_number:
                type: string
              currency:
                type: string
                pattern: ^[A-Z]{3}$
              kontonr:
                type: integer
                nullable: true
              vat_code:
                type: string
                nullable: true
          kreditor:
            type: object
            required:
            - kontonr
            - name
            - match
            - mode
            - candidates
            properties:
              kontonr:
                type: string
              name:
                type: string
              match:
                type: string
                nullable: true
              mode:
                type: string
              candidates:
                type: array
                items:
                  type: object
                  required:
                  - kontonr
                  - name
                  - match
                  properties:
                    kontonr:
                      type: string
                    name:
                      type: string
                    match:
                      type: string
                      nullable: true
            nullable: true
          rejection:
            type: object
            required:
            - code
            - message
            - at
            - by_name
            properties:
              code:
                type: string
              message:
                type: string
              at:
                type: string
              by_name:
                type: string
            nullable: true
          draft:
            type: object
            nullable: true
            required:
            - kassekladde_id
            - kladde_id
            - bilag
            - posted
            - journal_note
            properties:
              kassekladde_id:
                type: integer
              kladde_id:
                type: integer
              bilag:
                type: integer
              posted:
                type: boolean
              journal_note:
                type: string
          audit:
            type: array
            items:
              $ref: '#/components/schemas/T3AuditItem'
    T3Approve:
      type: object
      required:
      - id
      - status
      - review_state
      - display_status
      - draft
      - warnings
      - feedback
      - etag
      properties:
        id:
          type: integer
        status:
          type: string
        review_state:
          type: string
        display_status:
          type: string
        draft:
          type: object
          required:
          - kassekladde_id
          - kladde_id
          - bilag
          - mode
          - balanced
          - journal_note
          - currency
          - rate
          - rate_date
          properties:
            kassekladde_id:
              type: integer
            kladde_id:
              type: integer
            bilag:
              type: integer
            mode:
              type: string
              enum:
              - new_line
              - bank_row
              - attach_only
            balanced:
              type: boolean
              nullable: true
            journal_note:
              type: string
            currency:
              type: string
              pattern: ^[A-Z]{3}$
            rate:
              type: string
              nullable: true
              pattern: ^-?[0-9]+(?:\.[0-9]+)?$
            rate_date:
              type: string
              nullable: true
              format: date
            rate_source:
              type: string
        warnings:
          type: array
          items:
            type: object
            required:
            - code
            properties:
              code:
                type: string
                enum:
                - possible_duplicate
                - line_account_kept
                - posted_row_unchanged
                - file_move_pending
              bilag:
                type: integer
              kladde_id:
                type: integer
              source:
                type: string
              kontonr:
                type: integer
        feedback:
          type: object
          required:
          - outcome
          - kontonr
          - vendor_key
          properties:
            outcome:
              type: string
              enum:
              - accepted
              - corrected
              - none
            kontonr:
              type: integer
            vendor_key:
              type: string
              nullable: true
            feedback_id:
              type: integer
          nullable: true
        etag:
          type: string
          pattern: ^"[0-9a-f]{64}"$
    T3Reject:
      type: object
      required:
      - id
      - review_state
      - display_status
      - rejection
      - etag
      properties:
        id:
          type: integer
        review_state:
          type: string
        display_status:
          type: string
        rejection:
          type: object
          required:
          - code
          - message
          - at
          - by_name
          properties:
            code:
              type: string
            message:
              type: string
            at:
              type: string
            by_name:
              type: string
        etag:
          type: string
          pattern: ^"[0-9a-f]{64}"$
    T3Metadata:
      type: object
      required:
      - id
      - client_id
      - status
      - uploaded_at
      - sha256
      - filename
      - size
      - mimeType
      - uploadDate
      - extracted_data
      - metadata
      - attached_at
      - bilag_nr
      - deleted_at
      - review_state
      - display_status
      - rejection
      - vat_code
      - bank_line_id
      - etag
      properties:
        id:
          type: integer
        client_id:
          type: string
          format: uuid
          nullable: true
        status:
          type: string
        uploaded_at:
          type: string
        sha256:
          type: string
        filename:
          type: string
        size:
          type: integer
        mimeType:
          type: string
        uploadDate:
          type: string
        extracted_data:
