    # Attachment Schemas
    AttachmentUploadRequest:
      type: object
      required:
        - image_base64
      properties:
        image_base64:
          type: string
          format: byte
          description: Base64 file content, optionally prefixed with a data URI
        filename:
          type: string
          description: Optional filename; a random suffix is added before its extension
          example: invoice.pdf
        id:
          type: string
          description: Optional exact custom filename; takes precedence over `filename`
        accountnr:
          type: string
          description: Optional account number stored with the attachment
        extracted_data:
          type: object
          properties:
            total_amount:
              type: number
              format: float
