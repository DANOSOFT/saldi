    # Authentication Schemas
    LoginRequest:
      type: object
      required:
        - username
        - password
        - account_name
      properties:
        username:
          type: string
          description: Username of a user in the selected Saldi account
          example: api
        password:
          type: string
          format: password
          description: Password configured for that Saldi user
          example: your-api-user-password
        account_name:
          type: string
          description: Account name as shown in Saldi (the `regnskab` value), not the database name
          example: Your Saldi account name

    LoginResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Login successful
        data:
          type: object
          required:
            - access_token
            - refresh_token
            - token_type
            - expires_in
            - user
            - tenant
          properties:
            access_token:
              type: string
              description: JWT access token to send in the Authorization header
            refresh_token:
              type: string
              description: JWT refresh token with a 30-day lifetime
            token_type:
              type: string
              enum: [Bearer]
              example: Bearer
            expires_in:
              type: integer
              description: Access-token lifetime in seconds
              example: 3600
            user:
              $ref: '#/components/schemas/AuthenticatedUser'
            tenant:
              $ref: '#/components/schemas/AuthenticatedAccount'

    AuthenticatedUser:
      type: object
      required:
        - id
        - username
        - is_admin
      properties:
        id:
          type: integer
          example: 1
        username:
          type: string
          example: api
        is_admin:
          type: boolean
          example: false

    AuthenticatedAccount:
      type: object
      description: Selected account; returned under the legacy response field name `tenant`.
      required:
        - id
        - name
        - company_name
        - db
      properties:
        id:
          type: integer
          description: Numeric account ID (`regnskab.id`) embedded in the JWT as `tenant_id`
          example: 3
        name:
          type: string
          description: Account name used as `account_name` during login
          example: Your Saldi account name
        company_name:
          type: string
          description: Own adresser art S firmanavn; registry login name when blank or unavailable
        db:
          type: string
          description: Account database name
          example: saldi_3

    RefreshTokenRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          description: Refresh token returned by POST /auth/login.php

    RefreshTokenResponse:
      type: object
      required:
        - success
        - message
        - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Token refreshed successfully
        data:
          type: object
          required:
            - access_token
            - token_type
            - expires_in
          properties:
            access_token:
              type: string
              description: New JWT access token
            token_type:
              type: string
              enum: [Bearer]
              example: Bearer
            expires_in:
              type: integer
              example: 3600

    # Order Schemas
    CreateOrderRequest:
      type: object
      description: |
        Create a new order.
        
        **Required for new customers:**
        - `companyName` (or `firmanavn`) - Company name
        - `phone` (or `telefon`) - Phone number  
        - `email` - Email address
        - `vatRate` (or `momssats`) - VAT rate
        
        **Required for existing customers:**
        - `accountId` (or `konto_id`) - Existing customer account ID
        - `vatRate` (or `momssats`) - VAT rate
        
        **Common fields:**
        - `accountId` → `konto_id`
        - `companyName` → `firmanavn`
        - `phone` → `telefon`
        - `vatRate` → `momssats`
        - `orderNumber` → `ordrenr`
        - `orderDate` → `ordredate`
        - `invoiceDate` → `fakturadate`
        - `paid` → `betalt`
        - `costPrice` → `kostpris`
        - `vat` → `moms`
        - `currency` → `valuta`
        - `currencyRate` → `valutakurs`
        - `paymentTerms` → `betalingsbet`
        - `paymentDays` → `betalingsdage`
        - `accountNumber` → `kontonr`
        - `reference` → `ref`
        - `type` → `art`
        - `address1` → `addr1`
        - `address2` → `addr2`
        - `postalCode` → `postnr`
        - `city` → `bynavn`
        - `country` → `land`
        - `deliveryName` → `lev_navn`
        - `deliveryAddress1` → `lev_addr1`
        - `deliveryAddress2` → `lev_addr2`
        - `deliveryPostalCode` → `lev_postnr`
        - `deliveryCity` → `lev_bynavn`
        - `deliveryCountry` → `lev_land`
        - `cvrNo` → `cvrnr`
        - `customerGroup` → `kundegruppe`
      properties:
        # Customer identification (either accountId OR customer details required)
        accountId:
          type: integer
          description: Existing customer/supplier account ID (use this for existing customers)
          example: 201
        companyName:
          type: string
          description: Company name (required for new customers)
          example: "ACME Corporation"
        phone:
          type: string
          description: Phone number (required for new customers)
          example: "+45 12345678"
        email:
          type: string
          format: email
          description: Email address (required for new customers)
          example: "contact@acme.com"
        
        # Required fields
        vatRate:
          type: number
          format: float
          description: VAT rate percentage (required)
          example: 25.0
        
        # Financial information
        sum:
          type: number
          format: float
          description: Order total amount
          example: 1250.00
        costPrice:
          type: number
          format: float
          description: Cost price
          example: 1000.00
        vat:
          type: number
          format: float
          description: VAT amount
          example: 250.00
        currency:
          type: string
          description: Currency code (defaults to base currency if not provided)
          example: "DKK"
        currencyRate:
          type: number
          format: float
          description: Currency exchange rate (auto-calculated if not provided)
          example: 100.0
        
        # Payment terms
        paymentTerms:
          type: string
          description: Payment terms (defaults to 'netto' or customer's default)
          example: "netto"
        paymentDays:
          type: integer
          description: Payment days (defaults to 8 or customer's default)
          example: 30
        
        # Billing address
        address1:
          type: string
          description: Address line 1
          example: "Main Street 123"
        address2:
          type: string
          description: Address line 2
          example: "Suite 456"
        postalCode:
          type: string
          description: Postal code
          example: "1234"
        city:
          type: string
          description: City name
          example: "Copenhagen"
        country:
          type: string
          description: Country
          example: "Denmark"
        
        # Delivery address
        deliveryName:
          type: string
          description: Delivery contact name
          example: "ACME Warehouse"
        deliveryAddress1:
          type: string
          description: Delivery address 1
          example: "Industrial Road 789"
        deliveryAddress2:
          type: string
          description: Delivery address 2
          example: "Building B"
        deliveryPostalCode:
          type: string
          description: Delivery postal code
          example: "5678"
        deliveryCity:
          type: string
          description: Delivery city
          example: "Aarhus"
        deliveryCountry:
          type: string
          description: Delivery country
          example: "Denmark"
        
        # Other customer information
        ean:
          type: string
          description: EAN number
          example: "1234567890123"
        cvrNo:
          type: string
          description: CVR number
          example: "12345678"
        customerGroup:
          type: integer
          description: Customer group (defaults to 1 for new customers)
          example: 1
        
        # Order information
        orderDate:
          type: string
          format: date-time
          description: Order date (defaults to current date/time)
          example: "2025-07-31T10:30:00"
        invoiceDate:
          type: string
          format: date-time
          description: Invoice date (defaults to current date/time)
          example: "2025-07-31T10:30:00"
        notes:
          type: string
          description: Order notes
          example: "Urgent delivery required"
        paid:
          type: boolean
          description: Payment status
          example: false
        type:
          type: string
          description: Order type ('DO' for debitor, 'KO' for creditor)
          example: "DO"
          enum: ["DO", "KO"]
        status:
          type: integer
          description: Order status (defaults to 0)
          example: 0
        
        # Auto-generated fields (usually not provided in request)
        accountNumber:
          type: string
          description: Account number (auto-generated for new customers)
          example: "1001"
        reference:
          type: string
          description: Reference/user (auto-set from the authenticated JWT username)
          example: "user123"
        orderNumber:
          type: integer
          description: Order number (auto-generated)
          example: 2025001
        
        # Danish field names (for backward compatibility)
        konto_id:
          type: integer
          description: "[Danish] Existing customer account ID"
          example: 201
        firmanavn:
          type: string
          description: "[Danish] Company name"
          example: "ACME Corporation"
        telefon:
          type: string
          description: "[Danish] Phone number"
          example: "+45 12345678"
        momssats:
          type: number
          format: float
          description: "[Danish] VAT rate"
          example: 25.0
        kostpris:
          type: number
          format: float
          description: "[Danish] Cost price"
          example: 1000.00
        moms:
          type: number
          format: float
          description: "[Danish] VAT amount"
          example: 250.00
        valuta:
          type: string
          description: "[Danish] Currency"
          example: "DKK"
        valutakurs:
          type: number
          format: float
          description: "[Danish] Exchange rate"
          example: 100.0
        betalingsbet:
          type: string
          description: "[Danish] Payment terms"
          example: "netto"
        betalingsdage:
          type: integer
          description: "[Danish] Payment days"
          example: 8
        kontonr:
          type: string
          description: "[Danish] Account number"
          example: "1001"
        ref:
          type: string
          description: "[Danish] Reference"
          example: "user123"
        art:
          type: string
          description: "[Danish] Order type"
          example: "DO"
          enum: ["DO", "KO"]
        addr1:
          type: string
          description: "[Danish] Address line 1"
          example: "Main Street 123"
        addr2:
          type: string
          description: "[Danish] Address line 2"
          example: "Suite 456"
        postnr:
          type: string
          description: "[Danish] Postal code"
          example: "1234"
        bynavn:
          type: string
          description: "[Danish] City"
          example: "Copenhagen"
        land:
          type: string
          description: "[Danish] Country"
          example: "Denmark"
        lev_navn:
          type: string
          description: "[Danish] Delivery name"
          example: "ACME Warehouse"
        lev_addr1:
          type: string
          description: "[Danish] Delivery address 1"
          example: "Industrial Road 789"
        lev_addr2:
          type: string
          description: "[Danish] Delivery address 2"
          example: "Building B"
        lev_postnr:
          type: string
          description: "[Danish] Delivery postal code"
          example: "5678"
        lev_bynavn:
          type: string
          description: "[Danish] Delivery city"
          example: "Aarhus"
        lev_land:
          type: string
          description: "[Danish] Delivery country"
          example: "Denmark"
        cvrnr:
          type: string
          description: "[Danish] CVR number"
          example: "12345678"
        kundegruppe:
          type: integer
          description: "[Danish] Customer group"
          example: 1
        ordredate:
          type: string
          format: date-time
          description: "[Danish] Order date"
          example: "2025-07-31T10:30:00"
        fakturadate:
          type: string
          format: date-time
          description: "[Danish] Invoice date"
          example: "2025-07-31T10:30:00"
        betalt:
          type: boolean
          description: "[Danish] Paid status"
          example: false
        ordrenr:
          type: integer
          description: "[Danish] Order number"
          example: 2025001
      
