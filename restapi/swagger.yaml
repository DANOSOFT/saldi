# Attachment Management
  /attachment:
    get:
      tags:
      - Saldi Mobile
      summary: List own/authorized attachments or retrieve metadata and contained file
      description: bilag/own. Receipt-only users see their own rows; current readable finans/bilag grants colleagues
        visibility. No arbitrary path reads. List data is {items,limit,offset,total}. Deleted metadata remains addressable;
        downloading it returns gone. Binary success has no JSON envelope.
      parameters:
      - name: id
        in: query
        required: false
        description: Server integer id or UUID v4 client identity
        schema:
          oneOf:
          - type: integer
            minimum: 1
          - type: string
            format: uuid
      - name: client_id
        in: query
        required: false
        description: UUID v4 client identity alias
        schema:
          type: string
          format: uuid
      - name: file
        in: query
        required: false
        description: Legacy filename alias; database identity and ownership checks still apply
        schema:
          type: string
      - name: download
        in: query
        required: false
        description: true returns raw PDF bytes for a selected identity
        schema:
          type: boolean
      - name: limit
        in: query
        required: false
        description: ''
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
      - name: offset
        in: query
        required: false
        description: ''
        schema:
          type: integer
          minimum: 0
          default: 0
      - name: mine
        in: query
        required: false
        description: ''
        schema:
          type: integer
          enum:
          - 0
          - 1
          default: 0
      - name: status
        in: query
        required: false
        description: ''
        schema:
          type: string
          enum:
          - ubehandlet
          - attached
          - deleted
      responses:
        '200':
          description: Successful response
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Accepted client UUID or generated correlation id
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/MobileAttachmentResponse'
                - $ref: '#/components/schemas/MobileAttachmentListResponse'
            application/pdf:
              schema:
                type: string
                format: binary
        '400':
          description: 'validation_failed: malformed JSON or missing fields'
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'invalid_token, session_revoked: invalid/expired access token or revoked session'
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'permission_denied: module, owner, principal or membership denied'
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'validation_failed: identity or contained source file not found'
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: 'gone: upload identity is tombstoned'
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'validation_failed: invalid fields, year, page, PDF or rendering limits'
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'internal: generic Internal Server Error'
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Saldi Mobile
      summary: Durable idempotent base64 or multipart upload
      description: bilag/own. id/client_id is a UUID v4; omission generates it only when sha256 is omitted. sha256/size are verified when
        supplied. Same id+digest returns 200; changed digest 409; deleted id 410. PDF/JPEG/PNG only, 15 MiB, at most
        20 PDF pages and 60 million measured raster pixels. extracted_data.reminder_id resolves only the uploader
        recipient in the tenant transaction. T4 claim.kind=udlaeg publishes the expense identity atomically with
        the attachment; multipart claim is JSON encoded as text. It requires a linked employee (403 no_employee_link)
        and a configured payable account (422 not_configured); an invalid claim is 422 claim_invalid.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileAttachmentUploadRequest'
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                id:
                  type: string
                  format: uuid
                client_id:
                  type: string
                  format: uuid
                sha256:
                  type: string
                size:
                  type: integer
                accountnr:
                  type: string
                subject:
                  type: string
                claim:
                  type: string
                  description: JSON-encoded T4UploadClaim, published atomically with the attachment
                  example: '{"kind":"udlaeg"}'
                extracted_data:
                  type: string
                  description: JSON object encoded as text; reminder_id is a positive integer
            encoding:
              file:
                contentType: application/pdf, image/jpeg, image/png
      responses:
        '201':
          description: Successful response
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Accepted client UUID or generated correlation id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAttachmentResponse'
        '400':
          description: 'validation_failed: malformed JSON or missing fields'
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'invalid_token, session_revoked: invalid/expired access token or revoked session'
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 'permission_denied: module, owner, principal or membership denied'
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 'conflict: client id belongs to different content or state disallows mutation'
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '410':
          description: 'gone: upload identity is tombstoned'
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '413':
          description: 'payload_too_large: file exceeds 15 MiB or complete catalog exceeds 5000 rows'
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '415':
          description: 'unsupported_media_type: only PDF, JPEG or PNG are accepted'
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 'validation_failed: invalid fields, year, page, PDF or rendering limits'
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'internal: generic Internal Server Error'
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '200':
          description: Same client id and SHA-256 replay; existing identity
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Accepted client UUID or generated correlation id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAttachmentResponse'
    delete:
