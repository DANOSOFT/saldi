openapi: 3.0.3
# 20261001 CDX/LH Document tested Tier 1 envelopes, authorization, capabilities and deprecated routes.
# 20261001 CDX/LH Add implemented Tier 2 paths, method-specific rights and accounting response schemas.
# 20261005 CDX/LH Repair empty required lists and null parameters in the full OpenAPI document.
# 20261001 CDX/LH Add tested Tier 4 paths, rights, claim upload and field response contracts.
info:
  title: SALDI REST API
  description: |
    A comprehensive REST API for managing orders, customers, products, and inventory.

    ## Database terminology
    - **Registry database**: the owning database, such as `test`. Its `regnskab`
      table maps account IDs and names to account databases.
    - **Account database**: an owned accounting database, such as `test_36`. Users
      and accounting data are stored here.
    - **`tenant_id`**: the legacy JWT claim name for the numeric account ID
      (`regnskab.id`). It does not identify the registry database.
    - **`tenant` response field**: the legacy field name for the selected account.

    ## Authentication
    Every resource endpoint declares its server-side module/action; missing declarations deny
    with HTTP 403 data.error=permission_denied. Rights are read from the current database.
    Receipt capture, inbox, posting-chart, vat-codes, OCR-token and the own overview queue
    use bilag/own. Registry tenant tokens receive revisor rights. /auth/me.php reports
    attachments=v2, overview=v2 and multipart/ocr_token/push/reminders=true.

    Protected endpoints use JWT bearer authentication. The legacy `x-db`,
    `x-saldiuser`, and API-key-style `Authorization` headers are not accepted.

    1. Call `POST /auth/login.php` with the Saldi username, password, and account name.
    2. Copy `data.access_token` from the response.
    3. Send it as `Authorization: Bearer <access_token>`.

    Access tokens expire after 3600 seconds. Login also returns a refresh token
    with a 30-day lifetime for use with `POST /auth/refresh.php`.

    The selected account ID is embedded in the token as `tenant_id`, so
    `X-Tenant-ID` is not normally needed. It is only a compatibility fallback for
    an older token without that claim. Its value is the numeric account ID, not a
    registry or account database name.

  version: 1.2.0
  contact:
    name: API Support
servers:
  - url: ./endpoints/v1
    description: REST API in the current SALDI installation

security:
  - BearerAuth: []

paths:
  # Authentication
  /auth/login.php:
    post:
      tags:
      - Saldi Mobile
      summary: Account login or complete a password-bound 2FA challenge
      description: A missing device_id uses the legacy device. A twofactor user receives a challenge without tokens.
        Unknown account is 404 invalid_credentials; wrong credentials are 401 invalid_credentials. Closure, disabled
        user and IP restriction return 403 account_closed, user_disabled or ip_rejected.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileAccountLoginRequest'
      responses:
        '200':
          description: Successful response
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Accepted client UUID or generated correlation id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileAccountLoginResponse'
        '400':
          description: 'validation_failed: malformed JSON or missing fields'
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'invalid_credentials or 2fa_failed: credential/challenge rejected'
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: account_closed, user_disabled or ip_rejected
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: 'validation_failed (legacy handlers may return data null): unsupported method'
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: 'rate_limited: registry IP or normalized principal/account/user bucket exhausted; Retry-After:
            60'
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
            Retry-After:
              schema:
                type: integer
              description: Retry delay in seconds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'internal: generic Internal Server Error'
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 'invalid_credentials: account name not found'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh.php:
    post:
      tags:
      - Saldi Mobile
      summary: Refresh with device-bound rotation or the legacy access-only bridge
      description: Persist the rotated refresh token. A previous token can replay for 60 seconds on the same device;
        reuse outside grace revokes the family. An omitted device_id on a legacy refresh returns access-only data.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - refresh_token
              properties:
                refresh_token:
                  type: string
                device_id:
                  type: string
      responses:
        '200':
          description: Successful response
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
              description: Accepted client UUID or generated correlation id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileRefreshResponse'
        '400':
          description: 'validation_failed: malformed JSON or missing fields'
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: 'invalid_token, session_revoked: invalid/expired access token or revoked session'
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: account_closed, user_disabled, ip_rejected or permission_denied
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: 'validation_failed (legacy handlers may return data null): unsupported method'
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 'internal: generic Internal Server Error'
          headers:
            X-Request-Id:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

