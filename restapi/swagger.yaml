              type: string
            invoice_description:
              type: string
            currency:
              type: string
              pattern: ^[A-Z]{3}$
            vendor:
              type: string
            suggested_kontonr:
              type: string
        metadata:
          type: object
          required:
          - date
          - amount
          - accountnr
          - invoiceNumber
          - invoiceDescription
          - currency
          - subject
          properties:
            date:
              type: string
