# CodeRabbit settings for DANOSOFT/saldi. Anything not set here comes from the
# organisation settings in CodeRabbit (inheritance: true).
#
# CodeRabbit reviews and comments on every PR, but it no longer requests changes
# or approves. Its "changes requested" blocked merging exactly like a person's,
# and on 28 Oct ten open PRs were held only by it, with nobody nudged to act.
# A person now decides whether a finding matters; the author still fixes or
# answers each one.
inheritance: true
reviews:
  path_instructions:
    - path: "**/*.php"
      instructions: |
        Follow doc/ai/convention_database_changes.md for schema changes.
        Migrations for existing regnskaber belong at the end of
        includes/betweenUpdates.php. Exception: includes/opretfunc.php builds
        the initial schema and seed data when creating a new regnskab
        (opret_build_tenant()), so DDL there is intentional. Do not flag that
        initial-schema DDL as violating the migration-location convention.
        Changes that also affect existing regnskaber need a corresponding
        migration at the end of includes/betweenUpdates.php. This exception is
        temporary, until structure helper functions replace the current setup;
        it does not allow schema repair during ordinary page requests.
  auto_approvals:
    # Off: no change requests for blocking findings and no automatic approval.
    enabled: false
    # Authors cannot ask CodeRabbit to approve their own PR.
    allow_author_approval: false
